name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, type, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hunterflow
          POSTGRES_PASSWORD: hunterflow
          POSTGRES_DB: hunterflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hunterflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-groups
      - name: Lint
        working-directory: backend
        run: uv run ruff check app tests
      - name: Unit + integration tests (PostgreSQL + Redis)
        working-directory: backend
        env:
          HF_ENV: test
          HF_SECRET_KEY: ci-secret
          HF_DATABASE_URL: postgresql+psycopg://hunterflow:hunterflow@localhost:5432/hunterflow_test
          HF_REDIS_URL: redis://localhost:6379/0
        run: uv run pytest tests/unit tests/integration tests/security -q

  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: pip-audit
        working-directory: backend
        run: |
          python -m pip install --quiet pip-audit
          pip-audit --requirement <(uv export --no-dev --format requirements-txt) || true
      - name: npm audit
        working-directory: web
        run: npm audit --omit=dev || true

  e2e:
    name: E2E (Playwright, compose demo profile)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build images
        run: |
          echo "HF_SECRET_KEY=ci-e2e-secret-key" > .env
          docker compose build api web demo
      - name: Start stack
        run: docker compose --profile demo up -d
      - name: Wait for web
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs web api
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps + browsers
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: web
        run: npx playwright test e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
