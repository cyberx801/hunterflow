[project]
name = "hunterflow-backend"
version = "0.3.0"
description = "HunterFlow API and worker - self-hosted bug bounty research workspace"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "dramatiq[redis]>=1.17,<2",
    "redis>=5.2,<6",
    "structlog>=25.1,<26",
    "argon2-cffi>=23.1,<24",
    "python-multipart>=0.0.20",
    "httpx>=0.28,<1",
    "orjson>=3.10,<4",
    "reportlab>=4.2,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "hypothesis>=6.122,<7",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008", "E501", "UP042", "UP046"]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]


